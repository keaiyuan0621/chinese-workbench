<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Noto+Serif+SC:wght@500;600;700&display=swap"
      rel="stylesheet"
    />
    <link
      href="https://cdn.jsdelivr.net/npm/lxgw-wenkai-webfont@1.7.0/lxgwwenkai-regular.css"
      rel="stylesheet"
    />
    <title>现代汉语课程工作台</title>
    <script>
      (function () {
        var ids = ['nl-badge-frame', 'nl-hud-frame', 'netlify-badge']
        function stripNetlifyBadge() {
          for (var i = 0; i < ids.length; i++) {
            var el = document.getElementById(ids[i])
            if (el) el.remove()
          }
        }
        stripNetlifyBadge()
        new MutationObserver(stripNetlifyBadge).observe(document.documentElement, {
          childList: true,
          subtree: true,
        })
      })()
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
